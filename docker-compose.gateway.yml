services:
  autodeploy:
    ports: !reset []
    environment:
      AUTODEPLOY_SSH_PORT: ${AUTODEPLOY_SSH_PORT:-${GATEWAY_SSH_PORT:-2222}}
      AUTODEPLOY_HTTP_PORT: ${AUTODEPLOY_HTTP_PORT:-${GATEWAY_HTTP_PORT:-8080}}
    networks:
      - default
      - gateway

networks:
  gateway:
    external: true
    name: ${AUTODEPLOY_NETWORK:-autodeploy-gateway}
