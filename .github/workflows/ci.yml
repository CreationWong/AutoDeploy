name: ci

on:
  push:
    branches: [main, Dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 语法检查
        run: |
          for f in entrypoint.sh scripts/* tests/*.sh; do
            bash -n "$f"
          done
      - name: shellcheck
        run: shellcheck -S error entrypoint.sh scripts/* tests/*.sh
      - name: 推送地址日志回归测试
        run: bash tests/push-addresses.sh
      - name: 运行身份与配置校验回归测试
        run: |
          bash tests/runtime-users.sh
          bash tests/settings-validation.sh

  fresh-volume-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        docker-cli: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
      - name: 构建测试镜像
        run: docker build --build-arg INSTALL_DOCKER_CLI=${{ matrix.docker-cli }} -t autodeploy:fresh-volume-test .
      - name: 验证全新数据卷权限
        run: bash tests/fresh-volume-permissions.sh autodeploy:fresh-volume-test
      - name: 验证真实容器端口日志
        if: matrix.docker-cli == '1'
        run: bash tests/container-push-addresses.sh autodeploy:fresh-volume-test
      - name: 验证运行隔离与凭据保护
        run: bash tests/runtime-security.sh autodeploy:fresh-volume-test
      - name: 验证 Git 部署预检
        run: bash tests/deployment-preflight.sh autodeploy:fresh-volume-test
      - name: 准备网关镜像
        if: matrix.docker-cli == '0'
        run: docker pull nginx:1.27-alpine
      - name: 验证网关认证与请求上限
        if: matrix.docker-cli == '0'
        run: bash tests/gateway-security.sh autodeploy:fresh-volume-test

  secret-scan-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sensitive-info-check 正/负向自检
        run: |
          set -e
          tmp="$(mktemp -d)"
          git -C "$tmp" init -q -b main
          git -C "$tmp" config user.email ci@example.com
          git -C "$tmp" config user.name ci

          printf 'hello\n' > "$tmp/ok.txt"
          git -C "$tmp" add ok.txt
          (cd "$tmp" && bash "$GITHUB_WORKSPACE/.opencode/skills/sensitive-info-check/scan.sh" --staged)

          fake="AKIA$(printf 'A%.0s' $(seq 1 16))"
          printf 'aws_key = %s\n' "$fake" > "$tmp/leak.txt"
          git -C "$tmp" add leak.txt
          if (cd "$tmp" && bash "$GITHUB_WORKSPACE/.opencode/skills/sensitive-info-check/scan.sh" --staged); then
            echo "scan.sh 未拦截假密钥"
            exit 1
          fi
          echo "selftest ok"
