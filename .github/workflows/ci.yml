name: CI checks

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.rst'
      - '**/*.adoc'
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.markdown'
      - '**/*.rst'
      - '**/*.adoc'
  workflow_call:
    inputs:
      revision:
        description: Exact release commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Check Shell and Python source
        run: python3 -B ci/checks.py lint
      - name: Check release rules and push endpoints
        run: python3 -B ci/checks.py unit

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Build image and check container behavior
        run: python3 -B ci/checks.py containers --build

  secret-scan-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Check scanner acceptance and rejection
        run: python3 -B ci/checks.py scanner-selftest
