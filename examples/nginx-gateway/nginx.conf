events {}

http {
    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 128m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $git_upstream autodeploy:80;

        location / {
            # 让后端在读取大请求体前验证凭据；HTTP/1.1 同时覆盖 chunked 上传。
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_pass http://$git_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 80;
        server_name blog.localhost;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $blog_upstream my-app-web:4000;

        location / {
            proxy_pass http://$blog_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name app.localhost;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $process_upstream autodeploy:3000;

        location / {
            proxy_pass http://$process_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 22;
        set $ssh_upstream autodeploy:22;
        proxy_pass $ssh_upstream;
        proxy_timeout 1h;
    }
}
