services:
  gateway:
    image: nginx:1.27-alpine
    container_name: autodeploy-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
      - "${GATEWAY_SSH_PORT:-2222}:22"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - gateway

networks:
  gateway:
    external: true
    name: ${AUTODEPLOY_NETWORK:-autodeploy-gateway}
